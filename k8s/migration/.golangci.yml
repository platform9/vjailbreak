version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - staticcheck
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - unconvert
    - unparam
    - unused
    - whitespace
  exclusions:
    rules:
      # Exclude some linters from running on tests files.
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
      - path: pkg/scope
        linters:
          - dupl
      - path: pkg/sdk/keystone/keystone\.go
        linters:
          - dupl
      - path: pkg/sdk/resmgr/resmgr\.go
        linters:
          - dupl
      - path: pkg/utils/pcdutils\.go
        linters:
          - dupl
      # Exclude var-naming check for entire utils package
      - path: pkg/utils/
        linters:
          - revive
        text: "var-naming: avoid meaningless package names"
      # Pre-existing: goconst findings surfaced by golangci-lint v2.13.2 upgrade
      - path: internal/controller/(migrationplan|openstackcreds)_controller\.go
        linters:
          - goconst
      - path: pkg/(utils|metrics)/
        linters:
          - goconst
      # Pre-existing: goroutine with background context is intentional here
      - path: internal/controller/openstackcreds_controller\.go
        linters:
          - gosec
        text: "G118"
      # Pre-existing: ctrl.Result.Requeue deprecation in favour of RequeueAfter
      - path: internal/controller/.*_controller\.go
        linters:
          - staticcheck
        text: "SA1019"
    paths:
      - test
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    dupl:
      threshold: 100
