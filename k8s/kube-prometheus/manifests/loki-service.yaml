apiVersion: v1
kind: Service
metadata:
  labels:
    app: loki
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: vjailbreak-monitoring
  name: loki
  namespace: monitoring
spec:
  ports:
    - name: http
      port: 3100
      targetPort: http
    - name: grpc
      port: 9095
      targetPort: grpc
  selector:
    app: loki
  type: ClusterIP
