name: 'Create Docs PR'
description: 'Commits staged changes under docs/ to a new branch and opens a PR against gh-pages, if there are any staged changes.'
inputs:
  branch-prefix:
    description: 'Prefix for the new branch name (a unix timestamp is appended)'
    required: true
  commit-message:
    description: 'Commit message to use'
    required: true
  pr-title:
    description: 'Pull request title'
    required: true
  pr-body:
    description: 'Pull request body'
    required: true
  retry:
    description: "Retry 'gh pr create' up to 3 times with a 15s backoff on failure"
    required: false
    default: 'false'
  github-token:
    description: 'Token used by gh pr create / git push'
    required: true
runs:
  using: composite
  steps:
    - name: Create PR with changes
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "GitHub Actions Bot"

        TIMESTAMP=$(date +%s)
        NEW_BRANCH="${{ inputs.branch-prefix }}-$TIMESTAMP"

        git checkout -b "$NEW_BRANCH"
        git add docs/

        if ! git diff --cached --quiet; then
          git commit -m "${{ inputs.commit-message }}"
          git push origin "$NEW_BRANCH"

          if [[ "${{ inputs.retry }}" == "true" ]]; then
            for i in {1..3}; do
              if gh pr create --base gh-pages --head "$NEW_BRANCH" --title "${{ inputs.pr-title }}" --body "${{ inputs.pr-body }}"; then
                echo "PR created successfully on attempt $i."
                exit 0
              fi

              if [ $i -eq 3 ]; then
                echo "PR creation failed after 3 attempts."
                exit 1
              fi

              echo "PR creation failed on attempt $i. Retrying in 15 seconds..."
              sleep 15
            done
          else
            gh pr create --base gh-pages --head "$NEW_BRANCH" --title "${{ inputs.pr-title }}" --body "${{ inputs.pr-body }}"
          fi
        else
          echo "No changes were detected to create a pull request."
        fi
